<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <title>JavaScripTacToe</title>
    <script defer src="index.js"></script>
    <style>
        body {
            margin: 1rem auto;
            padding: 3rem;
            font-family: sans-serif;
        }

        header {
            width: 50%;
            margin: 1em auto;
        }

        #board {
            max-width: 50%;
            margin: 1em auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-gap: 1rem;
            background-color: teal;
        }

        .square {
            min-height: 1.3em;
            text-align: center;
            background-color: white;
            font-size: 5rem;
            font-family: monospace;
            color: black;
        }

        button {
            background-color: yellow;
            height: 5em;
            width: 5em;
            border-style: solid;
            border-width: 3px;
            border-color: black;
            border-radius: 5px;
            justify-self: center;
            align-self: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Tic Tac Toe</h1>
        <h2>By James O'Brien</h2>


        <div id="players">
            <p id="p1" class="player">Player <span id="p1-symbol">X</span>: <span id="p1Name"></span></p>
            <p id="p2" class="player">Player <span id="p2-symbol">O</span>: <span id="p2Name"></span></p>
        </div>
    </header>


    <div id="board">
        <div class="square" id="square1"></div>
        <div class="square" id="square2"></div>
        <div class="square" id="square3"></div>
        <div class="square" id="square4"></div>
        <div class="square" id="square5"></div>
        <div class="square" id="square6"></div>
        <div class="square" id="square7"></div>
        <div class="square" id="square8"></div>
        <div class="square" id="square9"></div>
    </div>


</body>

</html>
